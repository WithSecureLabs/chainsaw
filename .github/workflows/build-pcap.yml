name: build-pcap
on:
  push:
    branches: [ feat/pcap-ingestion ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup update stable && rustup default stable
      - name: Build (native pcap kind, no tshark)
        run: cargo build --release --verbose
      - name: Unit tests (BER/DER + existing)
        run: cargo test --release
      - name: Dissector proof — search the dissected Kerberos document (no detection rules)
        run: |
          echo "=== keyword search (sname) dumps the dissected doc as JSON ==="
          ./target/release/chainsaw search MSSQLSvc tests/samples/kerberoast_tgs_rc4.pcap --json | tee out.json
          echo "=== assert the Kerberos fields dissected correctly ==="
          grep -q '"msg_type_name": *"TGS-REQ"' out.json && echo "PASS msg_type_name TGS-REQ"
          grep -q 'MSSQLSvc' out.json && echo "PASS sname MSSQLSvc"
          python3 -c "import json,sys; d=json.load(open('out.json')); import re; s=json.dumps(d); assert 'TGS-REQ' in s and '23' in s; print('PASS document contains TGS-REQ and etype 23 (RC4)')"
