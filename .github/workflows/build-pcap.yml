name: build-pcap
on:
  push:
    branches: [ feat/pcap-ingestion ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup update stable && rustup default stable
      - name: Build (native pcap, no tshark)
        run: cargo build --release --verbose
      - name: Unit tests
        run: cargo test --release
      - name: Lint network rules
        run: ./target/release/chainsaw lint --kind sigma rules-network
      - name: End-to-end — hunt a Kerberoast TGS-REQ (RC4/etype 23) pcap
        run: |
          echo "=== hunting tests/samples/kerberoast_tgs_rc4.pcap ==="
          ./target/release/chainsaw hunt tests/samples/kerberoast_tgs_rc4.pcap \
            -s rules-network --mapping mappings/sigma-network.yml --jsonl 2>&1 | tee hunt.out || true
          echo "=== rule hits ==="
          grep -o '"name":"[^"]*"' hunt.out | sort -u || echo "NO HITS / see output above"
          echo "=== also plain search to confirm the pcap dissects at all ==="
          ./target/release/chainsaw search -t "Kerberos.msg_type: *" tests/samples/kerberoast_tgs_rc4.pcap 2>&1 | tail -30 || true
