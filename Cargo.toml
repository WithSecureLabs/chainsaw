[package]
name = "chainsaw"
version = "2.17.1"
repository = "https://github.com/WithSecureLabs/chainsaw"
description = "Rapidly Search and Hunt Through Windows Forensic Artefacts"
authors = ["James Dorgan <james@dorgan.io>","Alex Kornitzer <alex.kornitzer@withsecure.com>"]
readme = "README.md"
license = "GPL3"
edition = "2024"


[dependencies]
aho-corasick = "1.0"
anyhow = "1.0"
base64 = "0.23"
bincode = { version = "2.0", features = ["serde"] }
bytesize = "2.0"
chrono = "0.4"
chrono-tz = { version = "0.10", features = ["serde"] }
clap = { version = "4.0", features = ["derive"] }
crossterm = "0.29"
# --- PCAP ingestion (feat/pcap-ingestion) -----------------------------------
# NOTE: versions below are compilation-UNVERIFIED (authored without a Rust
# toolchain). Pin exact versions with `cargo update -p <crate>` on a build box.
#
# Native dissection backend (default, self-contained, no libpcap/tshark needed):
#   pcap-parser : pure-Rust reader for both legacy .pcap and .pcapng containers.
#   etherparse  : pure-Rust Ethernet/IPv4/IPv6/UDP/TCP parsing (L2..L4).
# Kerberos ASN.1 (RFC 4120) is dissected by a small hand-rolled BER/DER TLV
# reader inside src/file/pcap.rs — we intentionally avoid a general ASN.1 crate
# (rasn/der) for the first cut to keep the dependency + compile surface minimal.
pcap-parser = "0.16"
etherparse = "0.16"
evtx = { version = "0.12", default-features = false }
hex = "0.4.3"
indicatif = "0.18"
lazy_static = "1.4.0"
libesedb = "0.2.4"
mft = "0.6"
notatin = "1.0"
once_cell = "1.0"
prettytable-rs = "0.10"
quick-xml = { version = "0.42", features = ["serialize"] }
rayon = "1.5"
rand = "0.10"
regex = "1.6"
rustc-hash = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
serde_yaml = "0.9"
smallvec = "1.11"
tau-engine = { version = "1.0", features = ["core", "json", "sync"] }
tempfile = "3.2"
terminal_size = "0.4"
uuid = { version = "1.1", features = ["serde", "v4"] }

# Optional tshark-backed dissection backend. OFF by default so the default build
# stays a single self-contained binary (the "one tool" goal). Enable with
# `cargo build --release --features tshark`. Adds a RUNTIME dependency on a
# `tshark` binary being installed on the host.
rtshark = { version = "2", optional = true }


[features]
default = []
# tshark backend: breadth now, at the cost of a tshark runtime dependency.
tshark = ["dep:rtshark"]


[dev-dependencies]
assert_cmd = "2.0"
paste = "1.0"
predicates = "3.0"


# Handling abandoned upstreams...
[patch.crates-io]
libesedb = { git = 'https://github.com/alexkornitzer/rust-libesedb.git' }
mft = { git = 'https://github.com/alexkornitzer/mft.git' }
notatin = { git = 'https://github.com/alexkornitzer/notatin.git' }
