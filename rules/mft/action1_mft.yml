---
title: Action1
group: MFT
description: Action1 (remote management tool) artifacts
authors:
  - Krzysztof Kuzin

kind: mft
level: medium
status: stable
timestamp: StandardInfoCreated

fields:
  - name: FileNamePath
    to: FullPath
  - name: StandardInfoLastModified0x10
    to: StandardInfoLastModified
  - name: StandardInfoLastAccess0x10
    to: StandardInfoLastAccess
  - name: FileNameCreated0x30
    to: FileNameCreated
  - name: FileNameLastModified0x30
    to: FileNameLastModified
  - name: FileNameLastAccess0x30
    to: FileNameLastAccess
  - name: FileSize
    to: FileSize
  - name: IsADirectory
    to: IsADirectory
  - name: IsDeleted
    to: IsDeleted
  - name: HasAlternateDataStreams
    to: HasAlternateDataStreams
  - name: DataStreams
    to: DataStreams

filter:
  condition: anction1

  action1:
    FullPath:
      - 'i*/action1_agent.exe*'
      - 'i*/action1_remote.exe*'
      - 'i*/Windows/Action1/*'
