---
# WIRE FACT: The KDC-REQ-BODY `etype` SEQUENCE lists the client's requested
# encryption types in PREFERENCE ORDER (plaintext). Modern domain-joined
# Windows clients lead with AES (etype 18 = AES256, 17 = AES128). A client that
# leads with RC4-HMAC (etype 23 = 0x17) is a classic downgrade tell: Rubeus /
# Mimikatz overpass-the-hash and many ticket-forging tools request RC4 first (or
# only) because they hold an RC4/NT key, not an AES key. We key on
# Kerberos.etype_first == 23 in an AS-REQ.
#
# This is PLAINTEXT in the request body, so it works on ordinary encrypted
# Kerberos traffic. etype_first is the most-preferred etype; `Etypes` carries
# the full ordered list for tuning.
#
# COMPILATION/RUN STATE: UNVERIFIED.
title: Kerberos RC4 (etype 0x17) Requested Where AES Expected
id: 7c2f6a90-0f1e-4e2a-9b1a-0003deadbeef3
status: experimental
description: >
  Detects a Kerberos AS-REQ that leads with RC4-HMAC (etype 23 / 0x17) as its
  most-preferred encryption type, indicating an encryption-type downgrade
  consistent with overpass-the-hash or ticket-forging tooling.
author: chainsaw-pcap prototype
date: 2026/10/22
references:
  - https://www.rfc-editor.org/rfc/rfc4120
  - https://attack.mitre.org/techniques/T1558/003/
tags:
  - attack.credential_access
  - attack.t1558.003
  - attack.t1550.002
logsource:
  product: network
  service: kerberos
detection:
  is_as_req:
    MsgType: 10
  leads_with_rc4:
    EtypeFirst: 23
  condition: is_as_req and leads_with_rc4
level: medium
