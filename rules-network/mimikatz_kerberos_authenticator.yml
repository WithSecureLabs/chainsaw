---
# WIRE FACT: Mimikatz/kekeo-built Kerberos AP-REQ authenticators carry a
# distinctive byte pattern at the front of the authenticator structure
# (historically the sequence/cusec region shows the repeating 0x6c ("l")
# filler, e.g. 6c 6c 6c 00). We key on the AP-REQ authenticator's leading
# bytes exposed as Kerberos.authenticator_seq_hex.
#
# CAVEAT (see docs/pcap-ingestion.md §3.2): the AP-REQ authenticator is an
# EncryptedData, so authenticator_seq_hex is the CIPHERTEXT prefix. This rule
# therefore fires on captures where that structure is observable in cleartext
# (unencrypted test/lab traffic, or a pre-decrypted capture). It is included to
# demonstrate the schema hook requested in the brief, not to claim we decrypt
# live Kerberos.
#
# COMPILATION/RUN STATE: UNVERIFIED.
title: Mimikatz Kerberos Authenticator Byte Fingerprint
id: 7c2f6a90-0f1e-4e2a-9b1a-0001deadbeef1
status: experimental
description: >
  Detects the distinctive leading authenticator bytes (0x6c6c6c..) associated
  with Mimikatz/kekeo-generated Kerberos AP-REQ messages.
author: chainsaw-pcap prototype
date: 2026/10/22
references:
  - https://github.com/gentilkiwi/mimikatz
  - https://www.rfc-editor.org/rfc/rfc4120
tags:
  - attack.credential_access
  - attack.lateral_movement
  - attack.t1558
logsource:
  product: network
  service: kerberos
detection:
  is_ap_req:
    MsgType: 14
  mimikatz_authenticator:
    AuthenticatorSeq|startswith: "6c6c6c"
  condition: is_ap_req and mimikatz_authenticator
level: high
